version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///identity_spoofing.db
      - DEBUG_MODE=True
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - isds-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=isds_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=identity_spoofing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isds-network

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - isds-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  isds-network:
    driver: bridge
